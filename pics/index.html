  "articleBody": "I collected quite a few visualizations, scientific and non scientific, across the years. These figures are a playful subset patchwork of them, collected and arranged just for fun.\nDiffractive propagation of a cat.\nThis is what is means to have race conditions in Julia. Every point there corresponds to a full 3D Gross-Pitaevskii solution, taking minutes. What an adventure to have to manage these ghosts!\nWhen everything goes well, the Raman pump optimizer in the fiber makes the output power across the modes very flat. Thanks Gianluca!\nGDSFactory talks very well to MEEP. The design of integrated photonics is very easy with such nice tools. Here is a 50/50 splitter.\nSee above.\nSee above.\nWhen you have a lot of transmission channels over the fiber the Raman coupling between them may look bizzarre.\nA sort of spectral function for the microwave waveguide. Spectral parameter is the complex propagation vector.\nA rotation over high dimensional space. Wow.\nNaive translation of a ground state of a quartic oscillator. This excites a lot of modes.\nIf using the quadratic inverse STA design, we get much less excitation! Long life the STA!\n3D Gross-Pitaevskii in a trap has a lot of losses sometimes.\nA manual example of the Krotov quantum optimal control protocol for a Landau-Zener - like problem.\nLet’s compute the modes of a Kagome! We probably need a bit more RAM…\nYeah, this can run on your gameboy, but probably without much precision.\nNow we are talking!\nMy reception of a METEOR satellite! False colors.\nProjected band diagram of a photonic crystal tells you where you can host guided defect modes.\nFemWell is great. But am I using it Well?\nSolitons split at a barrier, but not always in a trivial way!\nIf you don’t treat the Raman stationary ODEs well, they explode.\nAnd signals too!\nA computational experiment following Stephen Wolfram ‘A new kind of science’.\nAre dots more ‘scientific’ than cats?\nEverything is an harmonic oscillator if you study it hard enough. But what does a harmonic oscillator do in relativistic regime?! Calm down!\nSecond order kernel in the Volterra series. What a strance familiar shape…\n",
